apiVersion: v1
kind: Service
metadata:
  name: simple-api-stable
spec:
  selector:
    app.kubernetes.io/name: simple-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: simple-api-canary
spec:
  selector:
    app.kubernetes.io/name: simple-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
