apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: simple-api
  labels:
    app.kubernetes.io/name: simple-api
    app.kubernetes.io/part-of: kagent-gitops-poc
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: simple-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simple-api
        app.kubernetes.io/part-of: kagent-gitops-poc
    spec:
      containers:
        - name: api
          image: kagent-poc-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
  strategy:
    canary:
      stableService: simple-api-stable
      canaryService: simple-api-canary
      trafficRouting:
        istio:
          virtualService:
            name: api-routes
            routes:
              - primary
          destinationRule:
            name: simple-api-destination
            canarySubsetName: canary
            stableSubsetName: stable
      steps:
        - setWeight: 10
        - pause:
            duration: 30s
        - setWeight: 50
        - pause:
            duration: 60s
        - setWeight: 100
