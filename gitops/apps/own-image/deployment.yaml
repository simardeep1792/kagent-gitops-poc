apiVersion: apps/v1
kind: Deployment
metadata:
  name: own-image
  labels:
    app.kubernetes.io/name: own-image
    app.kubernetes.io/part-of: kagent-gitops-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: own-image
  template:
    metadata:
      labels:
        app.kubernetes.io/name: own-image
        app.kubernetes.io/part-of: kagent-gitops-poc
    spec:
      containers:
        - name: own-image
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 96Mi
